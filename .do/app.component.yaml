functions:
  - name: oceanic-tracks-provider
    source_dir: /
    github:
      repo: mypreflight/oceanic-tracks-provider
      branch: main
      deploy_on_push: true
    envs:
      - key: OCEANIC_TRACKS_FUNCTION_SECRET
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: 'set-this-to-the-generated-secret'
      - key: NMS_API_HOST
        scope: RUN_AND_BUILD_TIME
        value: 'https://api-staging.cgifederal-aim.com'
      - key: NMS_CLIENT_ID
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: 'set-this-to-the-key-from-the-faa'
      - key: NMS_CLIENT_SECRET
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: 'set-this-to-the-secret-from-the-faa'

ingress:
  rules:
    - component:
        name: oceanic-tracks-provider
      match:
        path:
          prefix: /oceanic-tracks-provider
