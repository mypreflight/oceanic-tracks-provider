services:
  tracks:
    build:
      context: .
      target: development
    working_dir: /app/packages/oceanic-tracks/tracks
    env_file:
      - .env
    volumes:
      - .:/app
      - ./node_modules:/app/packages/oceanic-tracks/tracks/node_modules
    ports:
      - '3020:3000'
    healthcheck:
      test: 'curl --fail http://localhost:3000/health || exit 1'
      interval: 500ms
      retries: 3600
      start_period: 3s
      timeout: 500ms

  upstream-mock:
    image: mockserver/mockserver:mockserver-9.2.0@sha256:016f7d16bc88d2e1aa52d5a177f1aafee758cf70bea5e0624b0ab2c32f394df1
    ports:
      - '1280:1080'
    volumes:
      - ./docker/mock:/config
    environment:
      - MOCKSERVER_INITIALIZATION_JSON_PATH=/config/upstream.json
