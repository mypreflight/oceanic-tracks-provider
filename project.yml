targetNamespace: ''
parameters: {}
environment: {}
packages:
  - name: oceanic-tracks
    environment:
      OCEANIC_TRACKS_FUNCTION_SECRET: '${OCEANIC_TRACKS_FUNCTION_SECRET}'
      NMS_API_HOST: '${NMS_API_HOST}'
      NMS_CLIENT_ID: '${NMS_CLIENT_ID}'
      NMS_CLIENT_SECRET: '${NMS_CLIENT_SECRET}'
    functions:
      - name: tracks
        runtime: 'nodejs:24'
        main: main
        web: true
        webSecure: '${OCEANIC_TRACKS_FUNCTION_SECRET}'
        limits:
          timeout: 60000
          memory: 256
